[project]
name = "finguard-ai"
version = "0.2.0"
description = "Dynamic Risk Representation & Quantum-Enhanced Transaction Risk Management Platform"
authors = [{ name = "Pham Tien Dung" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
